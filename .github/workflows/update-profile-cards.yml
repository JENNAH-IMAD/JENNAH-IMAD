name: Update animated profile cards

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch contributions and render cards
        env:
          GH_PROFILE_USER: JENNAH-IMAD
        run: |
          python scripts/render_profile.py
          python scripts/render_three_worlds.py
      - name: Commit refreshed cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated profile cards [skip ci]"
          file_pattern: "cards/*.svg data/contributions.json"

