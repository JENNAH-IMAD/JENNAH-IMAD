  <g class="content" font-family="system-ui,sans-serif"><text x="28" y="91" fill="#f0f6fc" font-size="27" font-weight="700">Ship with confidence</text><text x="28" y="121" fill="#aab8c8" font-size="15">Docker � GitHub Actions � CI/CD</text></g>
  <rect class="shine" x="0" y="0" width="90" height="168" fill="url(#shine)" opacity=".24"/>
