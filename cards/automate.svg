<svg xmlns="http://www.w3.org/2000/svg" width="420" height="168" viewBox="0 0 420 168" role="img" aria-labelledby="title desc">
  <title id="title">Automate</title><desc id="desc">DevOps workflows, Docker and CI/CD pipelines.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#182b3b"/></linearGradient><linearGradient id="shine"><stop stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#b9dcff" stop-opacity=".65"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs>
  <style>@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.85}}@keyframes sweep{0%{transform:translateX(-460px)}100%{transform:translateX(460px)}}.content{animation:rise .8s ease-out .2s both}.dot{animation:glow 2.4s ease-in-out .5s infinite}.shine{animation:sweep 4.2s ease-in-out 1.4s infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
