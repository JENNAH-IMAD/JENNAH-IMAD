<svg xmlns="http://www.w3.org/2000/svg" width="880" height="285" viewBox="0 0 880 285" role="img" aria-label="Software engineer / Full-stack developer"><title>Software engineer / Full-stack developer</title><style>@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.enter{animation:rise .8s ease both}@media(prefers-reduced-motion:reduce){.enter{animation:none}}</style><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect x="1" y="1" width="878" height="283" rx="14" fill="#171a1b" stroke="#373c3e"/><text x="32" y="35" fill="#aab5c2" font-size="11" letter-spacing="1.5">01 / WHOAMI</text><text x="32" y="79" fill="#e6e8e7" font-size="27" font-weight="600">Software engineer / Full-stack developer</text><path d="M32 103H848" stroke="#373c3e"/><text class="enter" style="animation-delay:0.0s" x="32" y="137" fill="#c0c7ce" font-size="15">Casablanca, Morocco · Open to new opportunities</text><text class="enter" style="animation-delay:0.08s" x="32" y="165" fill="#c0c7ce" font-size="15">I turn ideas into useful applications, from need to deployment.</text><text class="enter" style="animation-delay:0.16s" x="32" y="193" fill="#c0c7ce" font-size="15">Business tools, booking systems and communication platforms.</text><text class="enter" style="animation-delay:0.24s" x="32" y="221" fill="#c0c7ce" font-size="15">React, Angular, Spring Boot and ASP.NET Core.</text><text class="enter" style="animation-delay:0.32s" x="32" y="249" fill="#c0c7ce" font-size="15">AI-assisted exploration, with careful review of the results.</text></g></svg>