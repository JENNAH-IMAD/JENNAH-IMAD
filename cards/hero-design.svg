<g class="r" style="animation-delay:0.55s"><text x="48" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#b9c0bf">I build full stack applications</text><text x="48" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#b9c0bf">and automate software delivery.</text></g>
