<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Imad Jennah, Full Stack Engineer in Casablanca, Morocco"><title>Imad Jennah, Full Stack Engineer in Casablanca, Morocco</title><style>
