  <text class="b" x="38" y="153" fill="#17202b" font-family="Georgia,serif" font-size="67" letter-spacing="-1">Imad Jennah</text>
  <text class="c" x="42" y="195" fill="#4e5865" font-family="system-ui,sans-serif" font-size="20">Building production-ready software, from thoughtful interfaces to automated delivery.</text>
  <text class="c" x="42" y="235" fill="#2369b3" font-family="ui-monospace,monospace" font-size="15">REACT   /   SPRING BOOT   /   .NET   /   DOCKER   /   CI/CD</text>
  <rect class="shine" x="0" y="0" width="260" height="270" fill="url(#sweep)" opacity=".28"/>
