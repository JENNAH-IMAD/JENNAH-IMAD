<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Imad Jennah - Full Stack Engineer</title><desc id="desc">Casablanca-based engineer building full stack software and automating delivery.</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ed"/><stop offset="1" stop-color="#eee9dd"/></linearGradient><linearGradient id="sweep"><stop stop-color="#195ca8" stop-opacity="0"/><stop offset=".5" stop-color="#195ca8" stop-opacity=".35"/><stop offset="1" stop-color="#195ca8" stop-opacity="0"/></linearGradient></defs>
  <style>@keyframes appear{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}@keyframes scan{0%{transform:translateX(-1500px)}100%{transform:translateX(1500px)}}.a{animation:appear .75s ease-out both}.b{animation:appear .75s ease-out .22s both}.c{animation:appear .75s ease-out .42s both}.shine{animation:scan 5s ease-in-out 1.2s infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect x="4" y="4" width="1192" height="262" rx="20" fill="url(#paper)" stroke="#d8d1c4" stroke-width="2"/>
